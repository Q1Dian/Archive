# Stage A′ ablation: Kalman familiarity gate, frozen representation from step13000.
run_name: stage_a_kalman
init_ckpt: checkpoints/stage_a/step13000.pt
length: 512
batch: 4
workers: 0
cache_gb: 10
checkpoint: false
rotate_every: 64
lr: 5.0e-5
weight_decay: 0.01
steps: 8000
log_every: 40
save_every: 1000
grad_clip: 1.0
seed: 2
surprise_key: surprise
freeze_repr: true
kalman_gate: true
