# Calibrate decoders (+ slow read) with L plugged in; frozen write path.
run_name: stage_b_joint_readout
init_ckpt: checkpoints/stage_b_joint/step1000.pt
length: 512
batch: 4
workers: 0
cache_gb: 10
checkpoint: false
rotate_every: 64
lr: 1.0e-4
weight_decay: 0.01
steps: 2000
log_every: 40
save_every: 1000
grad_clip: 1.0
seed: 6
surprise_key: surprise
joint_readout_tune: true
tune_slow: true
slow_enabled: true
slow_read: true
precision_fusion: true
kalman_gate: true
sigma_obs: 0.05
decay_on_write_only: true
rate_weight_max: 0.0
log_lam_min: 1.0e-4
log_lam_max: 1.0e-2
log_sigma_min: -3.0
log_sigma_max: 2.0
gate_bias: 2.0
